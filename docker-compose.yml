version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_reviewer_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

